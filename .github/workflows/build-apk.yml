name: Build Werewolf APK

# 什么时候触发：推代码 / 提 PR / 手动点按钮
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:   # 仓库页面 Actions 标签页里可以手动点「Run workflow」

# contents: write 是 softprops/action-gh-release 发 Release 必需的；
# 只给 read 的话构建能成功但最后归档那步会报 Resource not accessible by integration
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest          # GitHub 官方的 Linux 虚拟机，自带 JDK & Gradle 缓存
    timeout-minutes: 30

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          cache: true

      # 关键一步：把固定的签名证书还原到工程里。
      # 证书存在仓库 Secrets 中（加密），公开仓库看不到明文。
      # 有了它，每次构建出的 APK 签名都一样，手机上能直接覆盖安装升级。
      - name: 还原签名证书
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/werewolf.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=werewolf.jks\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" > android/key.properties
          echo "签名证书已就位：$(ls -l android/app/werewolf.jks | awk '{print $5}') 字节"

      - name: 接受 Android SDK 协议（漏这步 build apk 必挂）
        run: yes | flutter doctor --android-licenses || true

      - name: 内核自检
        run: |
          flutter pub get
          dart run scripts/logic_check.dart
          dart run scripts/room_check.dart
          dart run scripts/port_check.dart
          dart run scripts/page_check.dart   # 顺带把网页 JS 吐到 build/web_player_check.js

      # 网页玩家端是"零后端"方案里最脆的一环（浏览器 + SSE + POST），
      # 这里用 node 手写一个最小 EventSource，把页面里那段 JS 真的跑一遍，
      # 连的是 Dart 起的真实 HttpServer。
      - name: 网页玩家端端到端（真实 SSE + POST）
        run: |
          node --check build/web_player_check.js
          E2E_WAIT_SECONDS=25 dart run scripts/e2e_host.dart > /tmp/host.log 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:7799/ && break
            sleep 0.5
          done
          node scripts/e2e_web.mjs 7799 build/web_player_check.js
          wait $HOST_PID || true
          cat /tmp/host.log
          grep -q "HOST DONE" /tmp/host.log \
            || { echo "::error::房主没收到 /bye，退出腾座位这条路径断了"; exit 1; }

      - name: UI 冒烟测试
        run: flutter test

      - name: 读取版本号
        id: ver
        run: |
          V=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "full=$V" >> $GITHUB_OUTPUT
          echo "name=${V%%+*}" >> $GITHUB_OUTPUT
          echo "本局版本号: $V"

      - name: 编 Release APK
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      # 回归关卡：release 包一旦丢掉 INTERNET 权限，开房时会表现为"所有端口都被占用"，
      # 排查起来极费劲。这里直接拆开 APK 断言，缺权限就让构建红掉。
      - name: 校验 APK 网络权限
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          APK=build/app/outputs/apk/release/app-arm64-v8a-release.apk
          "$AAPT" dump badging "$APK" | grep '^uses-permission' | tee /tmp/perm.txt
          grep -q "android.permission.INTERNET" /tmp/perm.txt \
            || { echo "::error::release APK 缺 INTERNET 权限，联机必然失败"; exit 1; }
          echo "✅ INTERNET 权限已打进 release 包"

      - name: 上传 APK 成品
        uses: actions/upload-artifact@v4
        with:
          name: werewolf-apk
          path: build/app/outputs/apk/release/*.apk
          retention-days: 30          # 30 天后自动清，省存储

      - name: 归档到 Release（免登录下载）
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/apk/release/*.apk
          tag_name: v${{ steps.ver.outputs.name }}-b${{ github.run_number }}
          name: 狼邮杀 v${{ steps.ver.outputs.full }}（构建 ${{ github.run_number }}）
